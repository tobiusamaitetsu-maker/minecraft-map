name: Build bedrock-viz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            tar \
            openssh-client \
            sshpass \
            libboost-all-dev \
            libpng-dev \
            zlib1g-dev

      - name: Download world
        env:
          RINGO_SFTP_HOST: ${{ secrets.RINGO_SFTP_HOST }}
          RINGO_SFTP_PORT: ${{ secrets.RINGO_SFTP_PORT }}
          RINGO_SFTP_USER: ${{ secrets.RINGO_SFTP_USER }}
          RINGO_SFTP_PASSWORD: ${{ secrets.RINGO_SFTP_PASSWORD }}
        run: |
          mkdir -p world_archive
          cd world_archive

          sshpass -p "$RINGO_SFTP_PASSWORD" \
            sftp \
              -o StrictHostKeyChecking=no \
              -o BatchMode=no \
              -P "$RINGO_SFTP_PORT" \
              "$RINGO_SFTP_USER@$RINGO_SFTP_HOST" <<EOF
          get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world.tar.gz
          bye
          EOF

          ls -lh world.tar.gz

      - name: Extract world
        run: |
          mkdir -p world

          tar -xzf world_archive/world.tar.gz -C world

          echo "===== level.dat ====="
          find world -name level.dat -print

          echo "===== db directory ====="
          find world -type d -name db -print

      - name: Clone bedrock-viz
        run: |
          git clone --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

          cd bedrock-viz

          echo "===== bedrock-viz commit ====="
          git rev-parse HEAD

      - name: Apply patches
        working-directory: bedrock-viz
        run: |
          git apply -p0 patches/leveldb-1.22.patch
          git apply -p0 patches/pugixml-disable-install.patch

      - name: Fix LevelDB zlib include
        working-directory: bedrock-viz
        run: |
          FILE="third_party/leveldb/table/compressor/zlib_compressor.cc"

          if ! grep -q '#include <cstdint>' "$FILE"; then
            sed -i '1i#include <cstdint>' "$FILE"
          fi

      - name: Force C++17
        working-directory: bedrock-viz
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()

          # Remove previous experimental modifications if present.
          lines = text.splitlines()

          cleaned = []
          skip_comment = False

          for line in lines:
              if "Remove any externally injected C++11 standard flag." in line:
                  skip_comment = True
                  continue

              if skip_comment:
                  if line.strip().startswith("string(REGEX REPLACE"):
                      continue
                  skip_comment = False

              if "target_compile_features(${LIB_NAME} PRIVATE cxx_std_17)" in line:
                  continue

              if "set_property(TARGET ${LIB_NAME} PROPERTY CXX_STANDARD 17)" in line:
                  continue

              if "set_property(TARGET ${LIB_NAME} PROPERTY CXX_STANDARD_REQUIRED ON)" in line:
                  continue

              if "set_property(TARGET ${LIB_NAME} PROPERTY CXX_EXTENSIONS OFF)" in line:
                  continue

              cleaned.append(line)

          text = "\n".join(cleaned) + "\n"

          # Ensure C++17 is the project-wide standard.
          text = text.replace(
              "set(CMAKE_CXX_STANDARD 17)",
              "set(CMAKE_CXX_STANDARD 17)\n"
              "set(CMAKE_CXX_STANDARD_REQUIRED ON)\n"
              "set(CMAKE_CXX_EXTENSIONS OFF)",
              1
          )

          # Make the main library explicitly C++17.
          marker = "add_library(${LIB_NAME} STATIC ${SRC_FILES})"

          addition = """add_library(${LIB_NAME} STATIC ${SRC_FILES})

          set_property(TARGET ${LIB_NAME} PROPERTY CXX_STANDARD 17)
          set_property(TARGET ${LIB_NAME} PROPERTY CXX_STANDARD_REQUIRED ON)
          set_property(TARGET ${LIB_NAME} PROPERTY CXX_EXTENSIONS OFF)"""

          if "set_property(TARGET ${LIB_NAME} PROPERTY CXX_STANDARD 17)" not in text:
              if marker not in text:
                  raise SystemExit(
                      "libbedrock-viz の add_library() が見つかりません"
                  )

              text = text.replace(marker, addition, 1)

          path.write_text(text)

          print("C++17設定を適用しました")
          PY

          echo "===== CMakeLists.txt beginning ====="
          sed -n '1,45p' CMakeLists.txt

      - name: Remove C++11 flags from dependency CMake files
        working-directory: bedrock-viz
        run: |
          echo "===== Searching C++11 flags ====="

          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=build \
            'std=c\+\+11|std=gnu\+\+11' \
            . || true

          echo "===== Removing explicit C++11 compiler flags ====="

          find . \
            -type f \
            \( -name "CMakeLists.txt" -o -name "*.cmake" \) \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            -print0 |
          while IFS= read -r -d '' FILE; do
            sed -i \
              -e 's/-std=c++11//g' \
              -e 's/-std=gnu++11//g' \
              "$FILE"
          done

          echo "===== Remaining C++11 flags ====="

          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=build \
            'std=c\+\+11|std=gnu\+\+11' \
            . || true

      - name: Configure CMake
        working-directory: bedrock-viz
        run: |
          rm -rf build

          unset CXXFLAGS
          unset CFLAGS

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_CXX_FLAGS="" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Verify C++ standard
        working-directory: bedrock-viz
        run: |
          python3 - <<'PY'
          import json

          with open("build/compile_commands.json") as f:
              commands = json.load(f)

          found = False

          for item in commands:
              if item["file"].endswith("/src/asset.cc"):
                  found = True

                  print("===== asset.cc compile command =====")
                  print(item["command"])
                  print()

                  command = item["command"]

                  if "-std=c++11" in command:
                      raise SystemExit(
                          "ERROR: asset.cc に -std=c++11 が残っています"
                      )

                  if "-std=gnu++11" in command:
                      raise SystemExit(
                          "ERROR: asset.cc に -std=gnu++11 が残っています"
                      )

                  if "-std=c++17" not in command:
                      raise SystemExit(
                          "ERROR: asset.cc がC++17でコンパイルされていません"
                      )

                  print("C++17: OK")

          if not found:
              raise SystemExit(
                  "ERROR: asset.cc が見つかりません"
              )
          PY

      - name: Build
        working-directory: bedrock-viz
        run: |
          cmake --build build --parallel 2

      - name: Install
        working-directory: bedrock-viz
        run: |
          sudo cmake --install build

      - name: Verify installation
        run: |
          echo "===== executable ====="
          which bedrock-viz

          echo "===== installed data ====="
          ls -la /usr/local/share/bedrock-viz/data/

          test -f \
            /usr/local/share/bedrock-viz/data/bedrock_viz.xml

          echo "bedrock-viz installation: OK"

      - name: Test bedrock-viz
        run: |
          bedrock-viz --help
