name: Build bedrock-viz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            tar \
            openssh-client \
            sshpass \
            libboost-all-dev \
            libpng-dev \
            zlib1g-dev

      # ============================================================
      # 3. Download Minecraft world from RingoNetworks
      # ============================================================
      - name: Download world
        env:
          RINGO_SFTP_HOST: ${{ secrets.RINGO_SFTP_HOST }}
          RINGO_SFTP_PORT: ${{ secrets.RINGO_SFTP_PORT }}
          RINGO_SFTP_USER: ${{ secrets.RINGO_SFTP_USER }}
          RINGO_SFTP_PASSWORD: ${{ secrets.RINGO_SFTP_PASSWORD }}
        run: |
          mkdir -p world_archive

          cd world_archive

          sshpass -p "$RINGO_SFTP_PASSWORD" \
            sftp \
              -o StrictHostKeyChecking=no \
              -o BatchMode=no \
              -P "$RINGO_SFTP_PORT" \
              "$RINGO_SFTP_USER@$RINGO_SFTP_HOST" <<EOF
          get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world.tar.gz
          bye
          EOF

          ls -lh world.tar.gz

      # ============================================================
      # 4. Extract world
      # ============================================================
      - name: Extract world
        run: |
          mkdir -p world

          tar \
            -xzf world_archive/world.tar.gz \
            -C world

          echo "===== World files ====="

          find world \
            -maxdepth 3 \
            -type f \
            | head -50

          echo "===== Check level.dat ====="

          find world \
            -name level.dat \
            -print

          echo "===== Check db directory ====="

          find world \
            -type d \
            -name db \
            -print

      # ============================================================
      # 5. Clone official bedrock-viz repository
      # ============================================================
      - name: Clone bedrock-viz
        run: |
          git clone \
            --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

          cd bedrock-viz

          echo "===== bedrock-viz commit ====="
          git rev-parse HEAD

          echo "===== repository status ====="
          git status

      # ============================================================
      # 6. Apply official LevelDB compatibility patches
      # ============================================================
      - name: Apply bedrock-viz patches
        working-directory: bedrock-viz
        run: |
          git apply -p0 patches/leveldb-1.22.patch

          git apply -p0 patches/pugixml-disable-install.patch

      # ============================================================
      # 7. Fix LevelDB zlib include
      #
      # This is the only source-code modification retained.
      # The Ubuntu compiler requires <cstdint> for uint32_t.
      # ============================================================
      - name: Fix LevelDB zlib include
        working-directory: bedrock-viz
        run: |
          FILE="third_party/leveldb/table/compressor/zlib_compressor.cc"

          if ! grep -q '#include <cstdint>' "$FILE"; then
            sed -i '1i#include <cstdint>' "$FILE"
          fi

          echo "===== zlib_compressor.cc header ====="
          head -20 "$FILE"

      # ============================================================
      # 8. Verify compiler
      # ============================================================
      - name: Check compiler
        run: |
          echo "===== GCC ====="
          g++ --version

          echo "===== CMake ====="
          cmake --version

          echo "===== C++17 filesystem test ====="

          cat > /tmp/test_filesystem.cpp <<'EOF'
          #include <filesystem>

          int main()
          {
              std::filesystem::path p = ".";
              return 0;
          }
          EOF

          g++ \
            -std=c++17 \
            /tmp/test_filesystem.cpp \
            -o /tmp/test_filesystem

          echo "C++17 filesystem: OK"

      # ============================================================
      # 9. Configure bedrock-viz
      #
      # Do NOT modify CMakeLists.txt.
      # Do NOT force additional C++ flags.
      # Use the project's own CMake configuration.
      # ============================================================
      - name: Configure CMake
        working-directory: bedrock-viz
        run: |
          rm -rf build

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # ============================================================
      # 10. Display actual compiler settings
      # ============================================================
      - name: Inspect compile commands
        working-directory: bedrock-viz
        run: |
          echo "===== logger.cc compile command ====="

          python3 - <<'PY'
          import json

          with open("build/compile_commands.json", "r") as f:
              commands = json.load(f)

          for item in commands:
              if item["file"].endswith("/src/logger.cc"):
                  print(item["command"])
                  print()
          PY

          echo "===== asset.cc compile command ====="

          python3 - <<'PY'
          import json

          with open("build/compile_commands.json", "r") as f:
              commands = json.load(f)

          for item in commands:
              if item["file"].endswith("/src/asset.cc"):
                  print(item["command"])
                  print()
          PY

          echo "===== C++ standard flags ====="

          grep \
            -o -- '-std=[^ ]*' \
            build/compile_commands.json \
            | sort \
            | uniq -c \
            || true

      # ============================================================
      # 11. Build bedrock-viz
      # ============================================================
      - name: Build bedrock-viz
        working-directory: bedrock-viz
        run: |
          cmake \
            --build build \
            --parallel 2

      # ============================================================
      # 12. Verify build
      # ============================================================
      - name: Verify build
        working-directory: bedrock-viz
        run: |
          echo "===== Build directory ====="
          find build \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

          echo "===== bedrock-viz executable ====="

          find build \
            -type f \
            -name "bedrock-viz" \
            -print

      # ============================================================
      # 13. Install bedrock-viz
      # ============================================================
      - name: Install bedrock-viz
        working-directory: bedrock-viz
        run: |
          sudo cmake --install build

      # ============================================================
      # 14. Verify installation
      # ============================================================
      - name: Verify installation
        run: |
          echo "===== Installed executable ====="

          which bedrock-viz || true

          echo "===== Installed files ====="

          ls -la \
            /usr/local/share/bedrock-viz/ \
            || true

          echo "===== Installed data ====="

          ls -la \
            /usr/local/share/bedrock-viz/data/ \
            || true

          echo "===== Installed static ====="

          ls -la \
            /usr/local/share/bedrock-viz/static/ \
            | head -50 \
            || true

      # ============================================================
      # 15. Test bedrock-viz executable
      # ============================================================
      - name: Test bedrock-viz
        run: |
          bedrock-viz --help
