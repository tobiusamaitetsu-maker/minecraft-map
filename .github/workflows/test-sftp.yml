name: Generate Minecraft Map

on:
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. 必要なパッケージをインストール
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            python3 \
            python3-pip \
            openssh-client \
            sshpass \
            libboost-all-dev \
            zlib1g-dev \
            libpng-dev \
            libpng++-dev

      # --------------------------------------------------
      # 2. RingoNetworksからワールドアーカイブを取得
      # --------------------------------------------------
      - name: Download Minecraft world
        env:
          SSHPASS: ${{ secrets.RINGO_SFTP_PASSWORD }}
        run: |
          set -e

          mkdir -p world

          echo "=========================================="
          echo " Downloading Minecraft world"
          echo "=========================================="

          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P "${{ secrets.RINGO_SFTP_PORT }}" \
            "${{ secrets.RINGO_SFTP_USER }}@${{ secrets.RINGO_SFTP_HOST }}" <<'EOF'
          get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world/world.tar.gz
          bye
          EOF

          echo
          echo "=== Downloaded archive ==="

          ls -lh world/world.tar.gz

      # --------------------------------------------------
      # 3. ワールドを展開
      # --------------------------------------------------
      - name: Extract Minecraft world
        run: |
          set -e

          mkdir -p world/extracted

          echo "=========================================="
          echo " Extracting Minecraft world"
          echo "=========================================="

          tar -xzf world/world.tar.gz \
            -C world/extracted

          echo
          echo "=== Extracted files ==="

          find world/extracted \
            -maxdepth 3 \
            -type f \
            | head -100

      # --------------------------------------------------
      # 4. ワールドを確認
      # --------------------------------------------------
      - name: Validate Minecraft world
        run: |
          set -e

          WORLD_DIR="world/extracted"

          echo "=========================================="
          echo " Checking Minecraft world"
          echo "=========================================="

          echo
          echo "=== level.dat ==="

          if [ -f "$WORLD_DIR/level.dat" ]; then
            echo "Found:"
            echo "$WORLD_DIR/level.dat"
          else
            echo "ERROR: level.dat was not found."
            exit 1
          fi

          echo
          echo "=== db directory ==="

          if [ -d "$WORLD_DIR/db" ]; then
            echo "Found:"
            echo "$WORLD_DIR/db"
          else
            echo "ERROR: db directory was not found."
            exit 1
          fi

          echo
          echo "=== LevelDB file count ==="

          find "$WORLD_DIR/db" \
            -type f \
            | wc -l

      # --------------------------------------------------
      # 5. bedrock-vizを取得
      # --------------------------------------------------
      - name: Clone bedrock-viz
        run: |
          set -e

          echo "=========================================="
          echo " Cloning bedrock-viz"
          echo "=========================================="

          git clone --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

          cd bedrock-viz

          echo
          echo "=== bedrock-viz commit ==="

          git rev-parse HEAD

          echo
          echo "=== Submodule status ==="

          git submodule status

      # --------------------------------------------------
      # 6. LevelDBパッチを適用
      # --------------------------------------------------
      - name: Apply bedrock-viz patches
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " Available patches"
          echo "=========================================="

          ls -lh patches/

          echo
          echo "=========================================="
          echo " Applying LevelDB patch"
          echo "=========================================="

          git apply -p0 \
            patches/leveldb-1.22.patch

          echo
          echo "LevelDB patch applied successfully."

          echo
          echo "=========================================="
          echo " Applying pugixml patch"
          echo "=========================================="

          if [ -f patches/pugixml-disable-install.patch ]; then
            git apply -p0 \
              patches/pugixml-disable-install.patch

            echo
            echo "pugixml patch applied successfully."
          else
            echo "pugixml patch not found. Skipping."
          fi

      # --------------------------------------------------
      # 7. LevelDBパッチ適用後の確認
      # --------------------------------------------------
      - name: Verify LevelDB patch
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " LevelDB after patch"
          echo "=========================================="

          echo
          echo "=== DecompressAllocator ==="

          grep -RIn \
            "DecompressAllocator" \
            third_party/leveldb \
            || true

          echo
          echo "=== decompress_allocator ==="

          grep -RIn \
            "decompress_allocator" \
            third_party/leveldb \
            || true

          echo
          echo "=== kZlibRawCompression ==="

          grep -RIn \
            "kZlibRawCompression" \
            third_party/leveldb \
            || true

          echo
          echo "=== decompress_allocator.h ==="

          if [ -f third_party/leveldb/include/leveldb/decompress_allocator.h ]; then
            echo "FOUND:"
            echo "third_party/leveldb/include/leveldb/decompress_allocator.h"
          else
            echo "ERROR: decompress_allocator.h was not found."
            exit 1
          fi

          echo
          echo "=========================================="
          echo " Git status after patch"
          echo "=========================================="

          git status --short

      # --------------------------------------------------
      # 8. zlib_compressor.ccのC++型定義を確認
      # --------------------------------------------------
      - name: Fix zlib compressor include
        run: |
          set -e

          cd bedrock-viz

          FILE="third_party/leveldb/table/compressor/zlib_compressor.cc"

          echo "=========================================="
          echo " Checking zlib compressor"
          echo "=========================================="

          if [ -f "$FILE" ]; then

            echo
            echo "=== Before ==="

            sed -n '1,50p' "$FILE"

            python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "third_party/leveldb/table/compressor/zlib_compressor.cc"
          )

          text = path.read_text()

          if "#include <cstdint>" not in text:
              text = text.replace(
                  "#include <zlib.h>",
                  "#include <zlib.h>\n#include <cstdint>"
              )

              path.write_text(text)

              print("Added <cstdint>.")
          else:
              print("<cstdint> already exists.")
          PY

            echo
            echo "=== After ==="

            sed -n '1,50p' "$FILE"

          else
            echo "zlib_compressor.cc not found."
          fi

      # --------------------------------------------------
      # 9. libnbtplusplusのC++11指定をC++17へ変更
      # --------------------------------------------------
      - name: Fix libnbtplusplus C++ standard
        run: |
          set -e

          cd bedrock-viz

          FILE="third_party/libnbtplusplus/CMakeLists.txt"

          echo "=========================================="
          echo " Checking libnbtplusplus CMake"
          echo "=========================================="

          if [ -f "$FILE" ]; then

            echo
            echo "=== Before ==="

            grep -n \
              -E "std=c\+\+|CXX_STANDARD" \
              "$FILE" \
              || true

            python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "third_party/libnbtplusplus/CMakeLists.txt"
          )

          text = path.read_text()

          text = text.replace(
              "-std=c++11",
              "-std=c++17"
          )

          path.write_text(text)

          print("libnbtplusplus C++ standard updated.")
          PY

            echo
            echo "=== After ==="

            grep -n \
              -E "std=c\+\+|CXX_STANDARD" \
              "$FILE" \
              || true

          else
            echo "libnbtplusplus CMakeLists.txt not found."
          fi

      # --------------------------------------------------
      # 10. CMakeLists.txtをC++17に設定
      # --------------------------------------------------
      - name: Configure CMake settings
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " Configuring CMake C++ standard"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")

          text = path.read_text()

          if "set(CMAKE_CXX_STANDARD 17)" not in text:
              text = text.replace(
                  "project(bedrock-viz",
                  "set(CMAKE_CXX_STANDARD 17)\n"
                  "set(CMAKE_CXX_STANDARD_REQUIRED ON)\n"
                  "set(CMAKE_CXX_EXTENSIONS OFF)\n\n"
                  "project(bedrock-viz"
              )

          path.write_text(text)

          print("Top-level CMakeLists.txt updated.")
          PY

          echo
          echo "=== C++ standard settings ==="

          grep -n \
            -E "CXX_STANDARD|CXX_EXTENSIONS" \
            CMakeLists.txt \
            || true

      # --------------------------------------------------
      # 11. ビルドディレクトリ作成
      # --------------------------------------------------
      - name: Create build directory
        run: |
          set -e

          cd bedrock-viz

          rm -rf build

          mkdir build

      # --------------------------------------------------
      # 12. CMake
      # --------------------------------------------------
      - name: Run CMake
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " Running CMake"
          echo "=========================================="

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_CXX_FLAGS="-std=c++17" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # --------------------------------------------------
      # 13. C++17設定を確認
      # --------------------------------------------------
      - name: Verify compiler settings
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " CMake compiler"
          echo "=========================================="

          grep -E \
            "CMAKE_CXX_COMPILER:|CMAKE_C_COMPILER:" \
            CMakeCache.txt \
            || true

          echo
          echo "=========================================="
          echo " CMake C++ standard"
          echo "=========================================="

          grep -E \
            "CMAKE_CXX_STANDARD|CMAKE_CXX_FLAGS" \
            CMakeCache.txt \
            || true

          echo
          echo "=========================================="
          echo " compile_commands.json"
          echo "=========================================="

          if [ -f compile_commands.json ]; then

            grep -o \
              -- "-std=c++[0-9]*" \
              compile_commands.json \
              | sort \
              | uniq -c \
              || true

            echo
            echo "=== C++11 commands ==="

            if grep -n \
              -- "-std=c++11" \
              compile_commands.json; then

              echo "WARNING: C++11 command detected."

            else

              echo "No C++11 compile command detected."

            fi

            echo
            echo "=== C++17 commands ==="

            grep -n \
              -- "-std=c++17" \
              compile_commands.json \
              | head -20 \
              || true

          else
            echo "compile_commands.json not found."
          fi

      # --------------------------------------------------
      # 14. bedrock-vizをビルド
      # --------------------------------------------------
      - name: Build bedrock-viz
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " Building bedrock-viz"
          echo "=========================================="

          cmake --build . \
            --config Release \
            --parallel 2 \
            --verbose

      # --------------------------------------------------
      # 15. bedrock-vizをインストール
      # --------------------------------------------------
      - name: Install bedrock-viz
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " Installing bedrock-viz"
          echo "=========================================="

          sudo cmake --install .

      # --------------------------------------------------
      # 16. インストールされたファイルを確認
      # --------------------------------------------------
      - name: Verify bedrock-viz installation
        run: |
          set -e

          echo "=========================================="
          echo " Installed executable"
          echo "=========================================="

          which bedrock-viz

          echo
          echo "=========================================="
          echo " Installed data files"
          echo "=========================================="

          find \
            /usr/local/share/bedrock-viz \
            -maxdepth 3 \
            -type f \
            -print

          echo
          echo "=========================================="
          echo " Checking bedrock_viz.xml"
          echo "=========================================="

          if [ -f \
            /usr/local/share/bedrock-viz/data/bedrock_viz.xml
          ]; then

            echo "FOUND:"
            echo "/usr/local/share/bedrock-viz/data/bedrock_viz.xml"

          else

            echo "ERROR: bedrock_viz.xml was not installed."
            exit 1

          fi

      # --------------------------------------------------
      # 17. マップ生成
      # --------------------------------------------------
      - name: Generate map
        run: |
          set -e

          WORLD_DIR="$GITHUB_WORKSPACE/world/extracted"

          mkdir -p \
            "$GITHUB_WORKSPACE/map"

          echo "=========================================="
          echo " World"
          echo "=========================================="

          echo "$WORLD_DIR"

          echo
          echo "=== level.dat ==="

          ls -lh \
            "$WORLD_DIR/level.dat"

          echo
          echo "=== db ==="

          ls -ld \
            "$WORLD_DIR/db"

          echo
          echo "=========================================="
          echo " bedrock-viz"
          echo "=========================================="

          BEDROCK_VIZ="$(which bedrock-viz)"

          echo "Using:"
          echo "$BEDROCK_VIZ"

          echo
          echo "=========================================="
          echo " Running bedrock-viz"
          echo "=========================================="

          "$BEDROCK_VIZ" \
            --db "$WORLD_DIR" \
            --out "$GITHUB_WORKSPACE/map/out1" \
            --html-most

      # --------------------------------------------------
      # 18. マップ生成結果確認
      # --------------------------------------------------
      - name: Check generated map
        run: |
          set -e

          echo "=========================================="
          echo " Generated map"
          echo "=========================================="

          if [ -d map ]; then

            find map \
              -maxdepth 4 \
              -type f \
              | head -200

            echo
            echo "=== File count ==="

            find map \
              -type f \
              | wc -l

          else

            echo "ERROR: map directory was not created."
            exit 1

          fi

      # --------------------------------------------------
      # 19. GitHub Actions Artifactへ保存
      # --------------------------------------------------
      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-viz-map
          path: map/
          retention-days: 7
