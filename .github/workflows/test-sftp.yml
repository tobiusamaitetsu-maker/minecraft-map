name: Generate Minecraft Map

on:
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. 必要なパッケージをインストール
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            python3 \
            python3-pip \
            openssh-client \
            sshpass \
            libboost-all-dev \
            zlib1g-dev \
            libpng-dev

      # --------------------------------------------------
      # 2. RingoNetworksからワールドアーカイブを取得
      # --------------------------------------------------
      - name: Download Minecraft world
        env:
          SSHPASS: ${{ secrets.RINGO_SFTP_PASSWORD }}
        run: |
          set -e

          mkdir -p world

          echo "=== Downloading world archive ==="

          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P "${{ secrets.RINGO_SFTP_PORT }}" \
            "${{ secrets.RINGO_SFTP_USER }}@${{ secrets.RINGO_SFTP_HOST }}" <<'EOF'
          get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world/world.tar.gz
          bye
          EOF

          echo
          echo "=== Downloaded archive ==="
          ls -lh world/world.tar.gz

      # --------------------------------------------------
      # 3. ワールドを展開
      # --------------------------------------------------
      - name: Extract Minecraft world
        run: |
          set -e

          mkdir -p world/extracted

          echo "=== Extracting world ==="

          tar -xzf world/world.tar.gz \
            -C world/extracted

          echo
          echo "=== Extracted files ==="
          find world/extracted \
            -maxdepth 3 \
            -type f \
            | head -100

      # --------------------------------------------------
      # 4. level.dat と db を確認
      # --------------------------------------------------
      - name: Validate Minecraft world
        run: |
          set -e

          WORLD_DIR="world/extracted"

          echo "=== World directory ==="
          find "$WORLD_DIR" -maxdepth 2 -type f | head -100

          echo
          echo "=== level.dat ==="

          if [ -f "$WORLD_DIR/level.dat" ]; then
            echo "Found:"
            echo "$WORLD_DIR/level.dat"
          else
            echo "ERROR: level.dat was not found."
            exit 1
          fi

          echo
          echo "=== db directory ==="

          if [ -d "$WORLD_DIR/db" ]; then
            echo "Found:"
            echo "$WORLD_DIR/db"

            echo
            echo "=== Number of LevelDB files ==="
            find "$WORLD_DIR/db" -type f | wc -l
          else
            echo "ERROR: db directory was not found."
            exit 1
          fi

      # --------------------------------------------------
      # 5. bedrock-vizを取得
      # --------------------------------------------------
      - name: Clone bedrock-viz
        run: |
          set -e

          git clone --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

          cd bedrock-viz

          echo "=== bedrock-viz commit ==="
          git rev-parse HEAD

          echo
          echo "=== Submodule status ==="
          git submodule status

      # --------------------------------------------------
      # 6. LevelDBの状態を確認
      # --------------------------------------------------
      - name: Check LevelDB
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " LevelDB directory"
          echo "=========================================="

          ls -la third_party/leveldb

          echo
          echo "=========================================="
          echo " LevelDB git information"
          echo "=========================================="

          cd third_party/leveldb

          git rev-parse HEAD || true
          git log -1 --oneline || true

          echo
          echo "=== Git status ==="
          git status --short || true

          cd ../..

          echo
          echo "=========================================="
          echo " Search: DecompressAllocator"
          echo "=========================================="

          grep -RIn \
            "DecompressAllocator" \
            third_party/leveldb \
            || true

          echo
          echo "=========================================="
          echo " Search: decompress_allocator"
          echo "=========================================="

          grep -RIn \
            "decompress_allocator" \
            third_party/leveldb \
            || true

          echo
          echo "=========================================="
          echo " Search: kZlibRawCompression"
          echo "=========================================="

          grep -RIn \
            "kZlibRawCompression" \
            third_party/leveldb \
            || true

          echo
          echo "=========================================="
          echo " Search: zlib / compressor files"
          echo "=========================================="

          find third_party/leveldb \
            -type f \
            | grep -Ei 'compress|zlib' \
            || true

          echo
          echo "=========================================="
          echo " Search: ReadOptions"
          echo "=========================================="

          grep -RIn \
            "struct ReadOptions\|class ReadOptions" \
            third_party/leveldb/include \
            third_party/leveldb \
            || true

          echo
          echo "=========================================="
          echo " Search: decompress_allocator in all repository"
          echo "=========================================="

          grep -RIn \
            "decompress_allocator" \
            . \
            --exclude-dir=.git \
            || true

          echo
          echo "=========================================="
          echo " Search: kZlibRawCompression in all repository"
          echo "=========================================="

          grep -RIn \
            "kZlibRawCompression" \
            . \
            --exclude-dir=.git \
            || true

      # --------------------------------------------------
      # 7. LevelDBの既存パッチを確認
      # --------------------------------------------------
      - name: Inspect LevelDB patches
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " patches directory"
          echo "=========================================="

          if [ -d patches ]; then
            find patches \
              -maxdepth 3 \
              -type f \
              -print
          else
            echo "No patches directory found."
          fi

          echo
          echo "=========================================="
          echo " Search patches for LevelDB"
          echo "=========================================="

          grep -RIn \
            -Ei "leveldb|decompress|zlib|compression" \
            patches \
            2>/dev/null \
            || true

          echo
          echo "=========================================="
          echo " Search repository for patch commands"
          echo "=========================================="

          grep -RIn \
            -E "git apply|patch -p|apply.*patch" \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            || true

      # --------------------------------------------------
      # 8. zlib_compressor.ccの#includeを確認・修正
      # --------------------------------------------------
      - name: Patch zlib compressor include
        run: |
          set -e

          cd bedrock-viz

          FILE="third_party/leveldb/table/compressor/zlib_compressor.cc"

          echo "=== Checking ==="
          echo "$FILE"

          if [ -f "$FILE" ]; then
            echo
            echo "=== Before ==="
            sed -n '1,40p' "$FILE"

            python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "third_party/leveldb/table/compressor/zlib_compressor.cc"
          )

          text = path.read_text()

          if "#include <cstdint>" not in text:
              text = text.replace(
                  "#include <zlib.h>",
                  "#include <zlib.h>\n#include <cstdint>"
              )

              path.write_text(text)

              print("Added <cstdint>.")
          else:
              print("<cstdint> already exists.")
          PY

            echo
            echo "=== After ==="
            sed -n '1,40p' "$FILE"
          else
            echo "zlib_compressor.cc not found."
          fi

      # --------------------------------------------------
      # 9. CMakeLists.txt内のC++11指定を確認
      # --------------------------------------------------
      - name: Inspect CMake C++ standard
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " C++ standard settings"
          echo "=========================================="

          grep -RIn \
            -E "CXX_STANDARD|std=c\+\+11|std=c\+\+14|std=c\+\+17" \
            . \
            --include="CMakeLists.txt" \
            || true

      # --------------------------------------------------
      # 10. C++17を強制
      # --------------------------------------------------
      - name: Configure CMake
        run: |
          set -e

          cd bedrock-viz

          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_CXX_FLAGS="-std=c++17" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # --------------------------------------------------
      # 11. CMakeが実際に使うコンパイル設定を確認
      # --------------------------------------------------
      - name: Verify compiler settings
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " CMake compiler"
          echo "=========================================="

          grep -E \
            "CMAKE_CXX_COMPILER:|CMAKE_C_COMPILER:" \
            CMakeCache.txt \
            || true

          echo
          echo "=========================================="
          echo " CMake C++ standard"
          echo "=========================================="

          grep -E \
            "CMAKE_CXX_STANDARD|CMAKE_CXX_FLAGS" \
            CMakeCache.txt \
            || true

          echo
          echo "=========================================="
          echo " compile_commands.json"
          echo "=========================================="

          if [ -f compile_commands.json ]; then
            grep -o -- "-std=c++[0-9]*" \
              compile_commands.json \
              | sort \
              | uniq -c \
              || true

            echo
            echo "=== Any C++11 compile commands? ==="

            if grep -n -- "-std=c++11" compile_commands.json; then
              echo
              echo "WARNING: C++11 command detected."
            else
              echo "No C++11 compile command detected."
            fi

            echo
            echo "=== C++17 compile commands ==="

            grep -n -- "-std=c++17" \
              compile_commands.json \
              | head -20 \
              || true
          else
            echo "compile_commands.json not found."
          fi

      # --------------------------------------------------
      # 12. bedrock-vizをビルド
      # --------------------------------------------------
      - name: Build bedrock-viz
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " Building bedrock-viz"
          echo "=========================================="

          cmake --build . \
            --config Release \
            --parallel 2 \
            --verbose

      # --------------------------------------------------
      # 13. 実行ファイルを探す
      # --------------------------------------------------
      - name: Find bedrock-viz executable
        run: |
          set -e

          cd bedrock-viz

          echo "=== Executables ==="

          find . \
            -type f \
            -executable \
            -not -path "./.git/*" \
            -print

      # --------------------------------------------------
      # 14. bedrock-vizでマップ生成
      # --------------------------------------------------
      - name: Generate map
        run: |
          set -e

          WORLD_DIR="$GITHUB_WORKSPACE/world/extracted"

          mkdir -p "$GITHUB_WORKSPACE/map"

          echo "=========================================="
          echo " World"
          echo "=========================================="

          echo "$WORLD_DIR"

          echo
          echo "=========================================="
          echo " World files"
          echo "=========================================="

          ls -lh "$WORLD_DIR/level.dat"
          ls -ld "$WORLD_DIR/db"

          echo
          echo "=========================================="
          echo " Searching bedrock-viz"
          echo "=========================================="

          BEDROCK_VIZ=""

          for candidate in \
            "$GITHUB_WORKSPACE/bedrock-viz/build/bedrock-viz" \
            "$GITHUB_WORKSPACE/bedrock-viz/build/bin/bedrock-viz" \
            "$GITHUB_WORKSPACE/bedrock-viz/bedrock-viz"
          do
            if [ -x "$candidate" ]; then
              BEDROCK_VIZ="$candidate"
              break
            fi
          done

          if [ -z "$BEDROCK_VIZ" ]; then
            echo "ERROR: bedrock-viz executable was not found."

            find "$GITHUB_WORKSPACE/bedrock-viz/build" \
              -type f \
              -executable \
              -print

            exit 1
          fi

          echo "Using:"
          echo "$BEDROCK_VIZ"

          echo
          echo "=========================================="
          echo " Running bedrock-viz"
          echo "=========================================="

          "$BEDROCK_VIZ" \
            --db "$WORLD_DIR" \
            --out "$GITHUB_WORKSPACE/map/out1" \
            --html-most

      # --------------------------------------------------
      # 15. 生成結果を確認
      # --------------------------------------------------
      - name: Check generated map
        run: |
          set -e

          echo "=========================================="
          echo " Generated map"
          echo "=========================================="

          if [ -d map ]; then
            find map \
              -maxdepth 4 \
              -type f \
              | head -200

            echo
            echo "=== File count ==="

            find map \
              -type f \
              | wc -l
          else
            echo "ERROR: map directory was not created."
            exit 1
          fi

      # --------------------------------------------------
      # 16. GitHub Actions Artifactへ保存
      # --------------------------------------------------
      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-viz-map
          path: map/
          retention-days: 7
