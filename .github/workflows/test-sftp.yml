name: Test RingoNetworks SFTP

on:
  workflow_dispatch:

jobs:
  test-sftp:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Download world archive
        env:
          SSHPASS: ${{ secrets.RINGO_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.RINGO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.RINGO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.RINGO_SFTP_USER }}
        run: |
          mkdir -p world

          printf '%s\n' \
            'get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world/archive.tar.gz' \
            'bye' \
          | sshpass -e sftp \
              -o StrictHostKeyChecking=no \
              -P "$SFTP_PORT" \
              "$SFTP_USER@$SFTP_HOST"

      - name: Check downloaded archive
        run: |
          echo "=== archive ==="
          ls -lh world/archive.tar.gz

          echo "=== archive type ==="
          file world/archive.tar.gz

      - name: Extract world
        run: |
          mkdir -p extracted

          tar -xzf world/archive.tar.gz -C extracted

      - name: Check extracted files
        run: |
          echo "=== extracted files ==="
          find extracted -maxdepth 3 -type f | head -100

          echo "=== level.dat ==="
          find extracted -name level.dat -type f -print

          echo "=== db directory ==="
          find extracted -type d -name db -print
