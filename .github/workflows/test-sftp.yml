name: Generate Minecraft Map

on:
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            python3 \
            python3-pip \
            openssh-client \
            sshpass \
            libboost-all-dev \
            zlib1g-dev \
            libpng-dev

      # ============================================================
      # 3. Download Minecraft world archive from RingoNetworks
      # ============================================================
      - name: Download world archive
        env:
          RINGO_SFTP_HOST: ${{ secrets.RINGO_SFTP_HOST }}
          RINGO_SFTP_PORT: ${{ secrets.RINGO_SFTP_PORT }}
          RINGO_SFTP_USER: ${{ secrets.RINGO_SFTP_USER }}
          RINGO_SFTP_PASSWORD: ${{ secrets.RINGO_SFTP_PASSWORD }}
        run: |
          set -e

          mkdir -p world_archive

          echo "=== Downloading world archive ==="

          export SSHPASS="$RINGO_SFTP_PASSWORD"

          sshpass -e sftp \
            -P "$RINGO_SFTP_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$RINGO_SFTP_USER@$RINGO_SFTP_HOST" <<'EOF'
          get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world_archive/world.tar.gz
          EOF

          echo "=== Downloaded archive ==="
          ls -lh world_archive/world.tar.gz

      # ============================================================
      # 4. Extract Minecraft world
      # ============================================================
      - name: Extract world
        run: |
          set -e

          mkdir -p world

          echo "=== Extracting world ==="

          tar -xzf world_archive/world.tar.gz -C world

          echo "=== Extracted files ==="

          find world -maxdepth 3 -type f | head -100

      # ============================================================
      # 5. Locate level.dat
      # ============================================================
      - name: Locate world
        run: |
          set -e

          echo "=== Searching for level.dat ==="

          LEVEL_DAT=$(find world -name level.dat -type f | head -1)

          if [ -z "$LEVEL_DAT" ]; then
            echo "ERROR: level.dat was not found."
            exit 1
          fi

          WORLD_DIR=$(dirname "$LEVEL_DAT")

          echo "LEVEL_DAT=$LEVEL_DAT"
          echo "WORLD_DIR=$WORLD_DIR"

          echo "$WORLD_DIR" > world_dir.txt

      # ============================================================
      # 6. Validate world
      # ============================================================
      - name: Validate world
        run: |
          set -e

          WORLD_DIR=$(cat world_dir.txt)

          echo "=== World directory ==="
          echo "$WORLD_DIR"

          echo "=== level.dat ==="
          ls -lh "$WORLD_DIR/level.dat"

          echo "=== db directory ==="

          if [ ! -d "$WORLD_DIR/db" ]; then
            echo "ERROR: db directory was not found."
            exit 1
          fi

          ls -ld "$WORLD_DIR/db"

          echo "=== World validation passed ==="

      # ============================================================
      # 7. Clone bedrock-viz
      # ============================================================
      - name: Clone bedrock-viz
        run: |
          set -e

          git clone --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

          cd bedrock-viz

          echo "=== bedrock-viz commit ==="
          git rev-parse HEAD

      # ============================================================
      # 8. Apply LevelDB patch
      # ============================================================
      - name: Patch LevelDB
        run: |
          set -e

          cd bedrock-viz

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "third_party/leveldb/table/compressor/zlib_compressor.cc"
          )

          if not path.exists():
              print("LevelDB zlib_compressor.cc not found.")
              raise SystemExit(0)

          text = path.read_text()

          if "#include <cstdint>" not in text:
              text = text.replace(
                  "#include <zlib.h>",
                  "#include <zlib.h>\n#include <cstdint>"
              )

              path.write_text(text)

              print("Added <cstdint>.")
          else:
              print("<cstdint> already exists.")
          PY

      # ============================================================
      # 9. Force C++17 in all CMakeLists.txt files
      # ============================================================
      - name: Force C++17
        run: |
          set -e

          cd bedrock-viz

          echo "=== CMakeLists.txt before patch ==="

          grep -RInE \
            --include='CMakeLists.txt' \
            'CXX_STANDARD|std=c\+\+|std=gnu\+\+' \
            . || true

          echo
          echo "=== Replacing C++11 with C++17 ==="

          find . \
            -name CMakeLists.txt \
            -type f \
            -print0 |
          xargs -0 sed -i \
            -e 's/std=c++11/std=c++17/g' \
            -e 's/std=gnu++11/std=gnu++17/g' \
            -e 's/CXX_STANDARD[[:space:]]\+11/CXX_STANDARD 17/g'

          echo
          echo "=== CMakeLists.txt after patch ==="

          grep -RInE \
            --include='CMakeLists.txt' \
            'CXX_STANDARD|std=c\+\+|std=gnu\+\+' \
            . || true

      # ============================================================
      # 10. Force C++17 in the main CMake configuration
      # ============================================================
      - name: Patch top-level CMakeLists
        run: |
          set -e

          cd bedrock-viz

          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()

          required = """
          # Force C++17 for all targets.
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          add_compile_options(-std=c++17)
          """

          if "Force C++17 for all targets." not in text:
              marker = "project("

              start = text.find(marker)

              if start == -1:
                  raise RuntimeError("project() was not found.")

              line_end = text.find("\n", start)

              if line_end == -1:
                  line_end = len(text)

              text = (
                  text[:line_end + 1]
                  + required
                  + "\n"
                  + text[line_end + 1:]
              )

              path.write_text(text)

              print("Added global C++17 settings.")
          else:
              print("Global C++17 settings already exist.")
          PY

          echo "=== Top-level CMakeLists ==="
          sed -n '1,80p' CMakeLists.txt

      # ============================================================
      # 11. Prepare build directory
      # ============================================================
      - name: Prepare build directory
        run: |
          set -e

          cd bedrock-viz

          rm -rf build

          mkdir build

      # ============================================================
      # 12. Configure CMake
      # ============================================================
      - name: Configure CMake
        run: |
          set -e

          cd bedrock-viz/build

          export CC=gcc
          export CXX=g++

          export CXXFLAGS="-std=c++17"

          cmake .. \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_CXX_FLAGS="-std=c++17" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # ============================================================
      # 13. Verify compiler configuration
      # ============================================================
      - name: Verify C++17 compile flags
        run: |
          set -e

          cd bedrock-viz/build

          echo
          echo "=== CMake compiler ==="

          grep -E \
            'CMAKE_CXX_COMPILER:|CMAKE_C_COMPILER:' \
            CMakeCache.txt || true

          echo
          echo "=== CMake C++ standard ==="

          grep -E \
            'CMAKE_CXX_FLAGS:|CMAKE_CXX_STANDARD:' \
            CMakeCache.txt || true

          echo
          echo "=== compile_commands.json ==="

          if [ ! -f compile_commands.json ]; then
            echo "ERROR: compile_commands.json was not generated."
            exit 1
          fi

          grep -oE \
            -- '-std=[^" ]+' \
            compile_commands.json |
            sort |
            uniq -c

          echo
          echo "=== C++11 entries ==="

          python3 - <<'PY'
          import json

          with open("compile_commands.json") as f:
              commands = json.load(f)

          found = False

          for i, entry in enumerate(commands, 1):
              command = entry.get("command", "")

              if not command:
                  command = " ".join(
                      entry.get("arguments", [])
                  )

              if "-std=c++11" in command or "-std=gnu++11" in command:
                  found = True

                  print("=== C++11 FOUND ===")
                  print("Entry:", i)
                  print("File:", entry.get("file"))
                  print("Command:")
                  print(command)
                  print()

          if found:
              print(
                  "ERROR: C++11 compile flags are still present."
              )
              raise SystemExit(1)

          print("No C++11 compile flags found.")

          print()
          print("=== C++17 entries ===")

          count = 0

          for i, entry in enumerate(commands, 1):
              command = entry.get("command", "")

              if not command:
                  command = " ".join(
                      entry.get("arguments", [])
                  )

              if (
                  "-std=c++17" in command
                  or "-std=gnu++17" in command
              ):
                  count += 1

                  if count <= 10:
                      print("Entry:", i)
                      print("File:", entry.get("file"))
                      print(command)
                      print()

          if count == 0:
              print("ERROR: No C++17 compile commands found.")
              raise SystemExit(1)

          print(
              f"C++17 compile commands found: {count}"
          )
          PY

      # ============================================================
      # 14. Build bedrock-viz
      # ============================================================
      - name: Build bedrock-viz
        run: |
          set -e

          cd bedrock-viz

          echo "=== Building bedrock-viz ==="

          cmake --build build \
            --config Release \
            --parallel 2 \
            --verbose

      # ============================================================
      # 15. Locate executable
      # ============================================================
      - name: Locate bedrock-viz executable
        run: |
          set -e

          cd bedrock-viz

          echo "=== Searching executable ==="

          find build \
            -type f \
            -executable \
            -name 'bedrock-viz' \
            -print

          BEDROCK_VIZ=$(find build \
            -type f \
            -executable \
            -name 'bedrock-viz' \
            | head -1)

          if [ -z "$BEDROCK_VIZ" ]; then
            echo "ERROR: bedrock-viz executable was not found."
            exit 1
          fi

          echo "$BEDROCK_VIZ" > ../bedrock_viz_binary.txt

          echo "Executable:"
          echo "$BEDROCK_VIZ"

      # ============================================================
      # 16. Generate map
      # ============================================================
      - name: Generate map
        run: |
          set -e

          WORLD_DIR=$(cat world_dir.txt)
          BEDROCK_VIZ=$(cat bedrock_viz_binary.txt)

          rm -rf map

          mkdir -p map

          echo "=== World ==="
          echo "$WORLD_DIR"

          echo
          echo "=== bedrock-viz ==="
          echo "$BEDROCK_VIZ"

          echo
          echo "=== Generate map ==="

          "$BEDROCK_VIZ" \
            --db "$WORLD_DIR" \
            --out map/out1 \
            --html-most

          echo
          echo "=== Generated files ==="

          find map \
            -maxdepth 3 \
            -type f \
            | head -100

      # ============================================================
      # 17. Prepare GitHub Pages-friendly output
      # ============================================================
      - name: Prepare map artifact
        run: |
          set -e

          echo "=== Map size ==="
          du -sh map

          echo
          echo "=== HTML files ==="

          find map \
            -type f \
            -name '*.html' \
            -print

      # ============================================================
      # 18. Upload generated map as GitHub Actions Artifact
      # ============================================================
      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-viz-map
          path: map/
          retention-days: 7
