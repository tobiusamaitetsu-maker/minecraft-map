name: Generate Minecraft Map

on:
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            tar \
            libboost-all-dev \
            libpng-dev \
            zlib1g-dev

      - name: Download world
        env:
          RINGO_SFTP_HOST: ${{ secrets.RINGO_SFTP_HOST }}
          RINGO_SFTP_PORT: ${{ secrets.RINGO_SFTP_PORT }}
          RINGO_SFTP_USER: ${{ secrets.RINGO_SFTP_USER }}
          RINGO_SFTP_PASSWORD: ${{ secrets.RINGO_SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass

          mkdir -p world_archive
          cd world_archive

          sshpass -p "$RINGO_SFTP_PASSWORD" \
            sftp -o StrictHostKeyChecking=no \
            -P "$RINGO_SFTP_PORT" \
            "$RINGO_SFTP_USER@$RINGO_SFTP_HOST" <<EOF
          get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world.tar.gz
          bye
          EOF

      - name: Extract world
        run: |
          mkdir -p world
          tar -xzf world_archive/world.tar.gz -C world

          echo "World files:"
          find world -maxdepth 3 -type f | head -50

      - name: Clone bedrock-viz
        run: |
          git clone --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

      - name: Apply patches
        working-directory: bedrock-viz
        run: |
          git apply -p0 patches/leveldb-1.22.patch
          git apply -p0 patches/pugixml-disable-install.patch

      - name: Fix zlib include
        working-directory: bedrock-viz
        run: |
          FILE="third_party/leveldb/table/compressor/zlib_compressor.cc"

          if ! grep -q '#include <cstdint>' "$FILE"; then
            sed -i '1i#include <cstdint>' "$FILE"
          fi

      - name: Check compiler
        run: |
          g++ --version
          cmake --version

          echo "Testing C++17..."

          cat > /tmp/test.cpp <<'EOF'
          #include <filesystem>
          int main() {
              std::filesystem::path p = ".";
              return 0;
          }
          EOF

          g++ -std=c++17 /tmp/test.cpp -o /tmp/test

          echo "C++17 filesystem test: OK"

      - name: Configure
        working-directory: bedrock-viz
        run: |
          rm -rf build

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_CXX_FLAGS="-std=c++17" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Check logger compile command
        working-directory: bedrock-viz
        run: |
          echo "===== logger.cc compile command ====="

          python3 - <<'PY'
          import json

          with open("build/compile_commands.json") as f:
              data = json.load(f)

          for item in data:
              if item["file"].endswith("/src/logger.cc"):
                  print(item["command"])
                  print()
          PY

          echo "===== C++ standard flags ====="

          grep -o -- '-std=[^ ]*' build/compile_commands.json | sort | uniq -c || true

      - name: Build
        working-directory: bedrock-viz
        run: |
          cmake --build build --parallel 2
