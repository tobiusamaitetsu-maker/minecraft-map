name: Generate Minecraft Map

on:
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            python3 \
            python3-pip \
            openssh-client \
            sshpass \
            libboost-all-dev \
            zlib1g-dev \
            libpng-dev \
            libpng++-dev

      - name: Download Minecraft world
        env:
          SSHPASS: ${{ secrets.RINGO_SFTP_PASSWORD }}
        run: |
          set -e

          mkdir -p world

          echo "=========================================="
          echo " Downloading Minecraft world"
          echo "=========================================="

          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P "${{ secrets.RINGO_SFTP_PORT }}" \
            "${{ secrets.RINGO_SFTP_USER }}@${{ secrets.RINGO_SFTP_HOST }}" <<'EOF'
          get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world/world.tar.gz
          bye
          EOF

          echo
          echo "=== Downloaded archive ==="
          ls -lh world/world.tar.gz

      - name: Extract Minecraft world
        run: |
          set -e

          mkdir -p world/extracted

          echo "=========================================="
          echo " Extracting Minecraft world"
          echo "=========================================="

          tar -xzf world/world.tar.gz -C world/extracted

          echo
          echo "=== Extracted files ==="
          find world/extracted -maxdepth 3 -type f | head -100

      - name: Validate Minecraft world
        run: |
          set -e

          WORLD_DIR="$GITHUB_WORKSPACE/world/extracted"

          echo "=========================================="
          echo " Checking Minecraft world"
          echo "=========================================="

          echo
          echo "=== level.dat ==="

          if [ -f "$WORLD_DIR/level.dat" ]; then
            echo "Found:"
            echo "$WORLD_DIR/level.dat"
          else
            echo "ERROR: level.dat was not found."
            exit 1
          fi

          echo
          echo "=== db directory ==="

          if [ -d "$WORLD_DIR/db" ]; then
            echo "Found:"
            echo "$WORLD_DIR/db"
          else
            echo "ERROR: db directory was not found."
            exit 1
          fi

          echo
          echo "=== LevelDB file count ==="

          find "$WORLD_DIR/db" \
            -type f \
            | wc -l

      - name: Clone bedrock-viz
        run: |
          set -e

          echo "=========================================="
          echo " Cloning bedrock-viz"
          echo "=========================================="

          git clone --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

          cd bedrock-viz

          echo
          echo "=== bedrock-viz commit ==="

          git rev-parse HEAD

          echo
          echo "=== Submodule status ==="

          git submodule status

      - name: Apply bedrock-viz patches
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " Available patches"
          echo "=========================================="

          ls -lh patches/

          echo
          echo "=========================================="
          echo " Applying LevelDB patch"
          echo "=========================================="

          git apply -p0 patches/leveldb-1.22.patch

          echo
          echo "LevelDB patch applied successfully."

          echo
          echo "=========================================="
          echo " Applying pugixml patch"
          echo "=========================================="

          if [ -f "patches/pugixml-disable-install.patch" ]; then
            git apply -p0 patches/pugixml-disable-install.patch
            echo
            echo "pugixml patch applied successfully."
          else
            echo "pugixml patch not found. Skipping."
          fi

      - name: Verify LevelDB patch
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " LevelDB after patch"
          echo "=========================================="

          echo
          echo "=== DecompressAllocator ==="

          grep -RIn \
            "DecompressAllocator" \
            third_party/leveldb \
            || true

          echo
          echo "=== decompress_allocator ==="

          grep -RIn \
            "decompress_allocator" \
            third_party/leveldb \
            || true

          echo
          echo "=== kZlibRawCompression ==="

          grep -RIn \
            "kZlibRawCompression" \
            third_party/leveldb \
            || true

          echo
          echo "=== decompress_allocator.h ==="

          find third_party/leveldb \
            -name "decompress_allocator.h" \
            -print

          echo
          echo "=========================================="
          echo " Git status after patch"
          echo "=========================================="

          git status --short

      - name: Fix zlib compressor include
        run: |
          set -e

          cd bedrock-viz

          FILE="third_party/leveldb/table/compressor/zlib_compressor.cc"

          echo "=========================================="
          echo " Checking zlib compressor"
          echo "=========================================="

          if [ -f "$FILE" ]; then

            echo
            echo "=== Before ==="

            sed -n '1,50p' "$FILE"

            python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "third_party/leveldb/table/compressor/zlib_compressor.cc"
          )

          text = path.read_text()

          if "#include <cstdint>" not in text:
              text = text.replace(
                  "#include <zlib.h>",
                  "#include <zlib.h>\n#include <cstdint>"
              )

              path.write_text(text)

              print("Added <cstdint>.")
          else:
              print("<cstdint> already exists.")
          PY

            echo
            echo "=== After ==="

            sed -n '1,50p' "$FILE"

          else
            echo "zlib_compressor.cc not found."
          fi

      - name: Fix libnbtplusplus C++ standard
        run: |
          set -e

          cd bedrock-viz

          FILE="third_party/libnbtplusplus/CMakeLists.txt"

          echo "=========================================="
          echo " Checking libnbtplusplus CMake"
          echo "=========================================="

          if [ -f "$FILE" ]; then

            echo
            echo "=== Before ==="

            grep -n \
              -E "std=c\+\+|CXX_STANDARD" \
              "$FILE" \
              || true

            python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "third_party/libnbtplusplus/CMakeLists.txt"
          )

          text = path.read_text()

          text = text.replace(
              "-std=c++11",
              "-std=c++17"
          )

          path.write_text(text)

          print(
              "libnbtplusplus C++ standard updated."
          )
          PY

            echo
            echo "=== After ==="

            grep -n \
              -E "std=c\+\+|CXX_STANDARD" \
              "$FILE" \
              || true

          else
            echo "libnbtplusplus CMakeLists.txt not found."
          fi

      - name: Configure CMake settings
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " Configuring CMake C++ standard"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")

          text = path.read_text()

          if "set(CMAKE_CXX_STANDARD 17)" not in text:

              text = text.replace(
                  "project(bedrock-viz",
                  "set(CMAKE_CXX_STANDARD 17)\n"
                  "set(CMAKE_CXX_STANDARD_REQUIRED ON)\n"
                  "set(CMAKE_CXX_EXTENSIONS OFF)\n\n"
                  "project(bedrock-viz"
              )

              path.write_text(text)

              print(
                  "Top-level CMakeLists.txt updated."
              )

          else:
              print(
                  "C++17 configuration already exists."
              )
          PY

          echo
          echo "=== C++ standard settings ==="

          grep -n \
            -E "CXX_STANDARD|CXX_EXTENSIONS" \
            CMakeLists.txt \
            || true

      - name: Create build directory
        run: |
          set -e

          cd bedrock-viz

          rm -rf build

          mkdir build

      - name: Run CMake
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " Running CMake"
          echo "=========================================="

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_CXX_FLAGS="-std=c++17" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Verify compiler settings
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " CMake compiler"
          echo "=========================================="

          grep \
            -E "CMAKE_CXX_COMPILER:|CMAKE_C_COMPILER:" \
            CMakeCache.txt \
            || true

          echo
          echo "=========================================="
          echo " CMake C++ standard"
          echo "=========================================="

          grep \
            -E "CMAKE_CXX_STANDARD|CMAKE_CXX_FLAGS" \
            CMakeCache.txt \
            || true

          echo
          echo "=========================================="
          echo " compile_commands.json"
          echo "=========================================="

          if [ -f "compile_commands.json" ]; then

            grep \
              -o \
              -- "-std=c++[0-9]*" \
              compile_commands.json \
              | sort \
              | uniq -c \
              || true

            echo
            echo "=== C++11 commands ==="

            if grep \
              -n \
              -- "-std=c++11" \
              compile_commands.json
            then
              echo "WARNING: C++11 command detected."
            else
              echo "No C++11 compile command detected."
            fi

            echo
            echo "=== C++17 commands ==="

            grep \
              -n \
              -- "-std=c++17" \
              compile_commands.json \
              | head -20 \
              || true

          else
            echo "compile_commands.json not found."
          fi

      - name: Build bedrock-viz
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " Building bedrock-viz"
          echo "=========================================="

          cmake --build . \
            --config Release \
            --parallel 2 \
            --verbose

      # ============================================================
      # LevelDB inspection starts here.
      # At this point the LevelDB headers and library have actually
      # been generated by the bedrock-viz build.
      # ============================================================

      - name: Locate LevelDB files
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " Locating LevelDB files"
          echo "=========================================="

          echo
          echo "=== db.h ==="

          find third_party/leveldb \
            -name "db.h" \
            -print

          echo
          echo "=== libleveldb ==="

          find build third_party/leveldb \
            \( \
              -name "libleveldb.a" \
              -o \
              -name "libleveldb.so" \
              -o \
              -name "libleveldb.so.*" \
            \) \
            -print

      - name: Build LevelDB inspection tool
        run: |
          set -e

          cd bedrock-viz

          echo "=========================================="
          echo " Building LevelDB inspection tool"
          echo "=========================================="

          DB_HEADER="$(
            find third_party/leveldb \
              -path "*/leveldb/db.h" \
              -print \
              | head -1
          )"

          if [ -z "$DB_HEADER" ]; then
            echo "ERROR: leveldb/db.h could not be located."
            exit 1
          fi

          LEVELDB_INCLUDE="$(
            dirname \
              "$(dirname "$DB_HEADER")"
          )"

          LEVELDB_LIBRARY="$(
            find build third_party/leveldb \
              -name "libleveldb.a" \
              -print \
              | head -1
          )"

          if [ -z "$LEVELDB_LIBRARY" ]; then
            echo "ERROR: libleveldb.a could not be located."
            exit 1
          fi

          echo
          echo "=== LevelDB header ==="
          echo "$DB_HEADER"

          echo
          echo "=== LevelDB include directory ==="
          echo "$LEVELDB_INCLUDE"

          echo
          echo "=== LevelDB library ==="
          echo "$LEVELDB_LIBRARY"

          cat > /tmp/inspect_leveldb.cpp <<'CPP'
          #include <iostream>
          #include <string>
          #include <vector>
          #include <iomanip>
          #include <cstdint>
          #include <cstring>
          #include <memory>

          #include "leveldb/db.h"
          #include "leveldb/iterator.h"
          #include "leveldb/options.h"

          static void printHex(
              const std::string& data,
              size_t maxBytes = 96
          ) {
              size_t count = data.size();

              if (count > maxBytes) {
                  count = maxBytes;
              }

              for (size_t i = 0; i < count; ++i) {

                  unsigned int value =
                      static_cast<unsigned char>(
                          data[i]
                      );

                  std::cout
                      << std::hex
                      << std::setw(2)
                      << std::setfill('0')
                      << value
                      << " ";
              }

              std::cout << std::dec;

              if (data.size() > maxBytes) {
                  std::cout << "...";
              }
          }

          static bool isSubChunkKey(
              const std::string& key
          ) {
              if (key.size() < 10) {
                  return false;
              }

              return
                  static_cast<unsigned char>(
                      key[8]
                  ) == 0x2f;
          }

          int main(
              int argc,
              char** argv
          ) {
              if (argc < 2) {

                  std::cerr
                      << "Usage: inspect_leveldb <db_path>"
                      << std::endl;

                  return 1;
              }

              const std::string path = argv[1];

              leveldb::Options options;

              options.create_if_missing = false;

              leveldb::DB* db = nullptr;

              leveldb::Status status =
                  leveldb::DB::Open(
                      options,
                      path,
                      &db
                  );

              if (!status.ok()) {

                  std::cerr
                      << "Failed to open LevelDB: "
                      << status.ToString()
                      << std::endl;

                  return 2;
              }

              std::cout
                  << "=========================================="
                  << std::endl;

              std::cout
                  << " LevelDB SubChunk inspection"
                  << std::endl;

              std::cout
                  << "=========================================="
                  << std::endl;

              std::cout
                  << "DB: "
                  << path
                  << std::endl;

              std::unique_ptr<leveldb::Iterator> it(
                  db->NewIterator(
                      leveldb::ReadOptions()
                  )
              );

              size_t total = 0;
              size_t subchunks = 0;

              size_t value0 = 0;
              size_t value1 = 0;
              size_t value2 = 0;
              size_t value3 = 0;
              size_t value4 = 0;
              size_t value5 = 0;
              size_t value6 = 0;
              size_t value7 = 0;
              size_t value8 = 0;
              size_t value9 = 0;

              for (
                  it->SeekToFirst();
                  it->Valid();
                  it->Next()
              ) {

                  ++total;

                  const std::string key =
                      it->key().ToString();

                  const std::string value =
                      it->value().ToString();

                  if (!isSubChunkKey(key)) {
                      continue;
                  }

                  ++subchunks;

                  if (value.size() < 2) {
                      continue;
                  }

                  unsigned int version =
                      static_cast<unsigned char>(
                          value[0]
                      );

                  unsigned int second =
                      static_cast<unsigned char>(
                          value[1]
                      );

                  switch (second) {

                      case 0:
                          ++value0;
                          break;

                      case 1:
                          ++value1;
                          break;

                      case 2:
                          ++value2;
                          break;

                      case 3:
                          ++value3;
                          break;

                      case 4:
                          ++value4;
                          break;

                      case 5:
                          ++value5;
                          break;

                      case 6:
                          ++value6;
                          break;

                      case 7:
                          ++value7;
                          break;

                      case 8:
                          ++value8;
                          break;

                      case 9:
                          ++value9;
                          break;

                      default:
                          break;
                  }

                  if (
                      second == 5 ||
                      second == 0 ||
                      second == 1 ||
                      second == 2 ||
                      second == 3 ||
                      second == 4 ||
                      second == 6 ||
                      second == 7 ||
                      second == 8 ||
                      second == 9
                  ) {

                      int32_t chunkX = 0;
                      int32_t chunkZ = 0;

                      std::memcpy(
                          &chunkX,
                          key.data(),
                          sizeof(int32_t)
                      );

                      std::memcpy(
                          &chunkZ,
                          key.data() + 4,
                          sizeof(int32_t)
                      );

                      unsigned int subChunkY =
                          static_cast<unsigned char>(
                              key[9]
                          );

                      std::cout
                          << std::endl;

                      std::cout
                          << "SubChunk candidate"
                          << std::endl;

                      std::cout
                          << "  chunk X: "
                          << chunkX
                          << std::endl;

                      std::cout
                          << "  chunk Z: "
                          << chunkZ
                          << std::endl;

                      std::cout
                          << "  subchunk Y byte: "
                          << subChunkY
                          << std::endl;

                      std::cout
                          << "  value size: "
                          << value.size()
                          << std::endl;

                      std::cout
                          << "  version: "
                          << version
                          << std::endl;

                      std::cout
                          << "  value[1]: "
                          << second
                          << std::endl;

                      std::cout
                          << "  value hex: ";

                      printHex(value);

                      std::cout
                          << std::endl;
                  }
              }

              if (!it->status().ok()) {

                  std::cerr
                      << "Iterator error: "
                      << it->status().ToString()
                      << std::endl;
              }

              std::cout
                  << std::endl;

              std::cout
                  << "=========================================="
                  << std::endl;

              std::cout
                  << " Summary"
                  << std::endl;

              std::cout
                  << "=========================================="
                  << std::endl;

              std::cout
                  << "Total LevelDB records: "
                  << total
                  << std::endl;

              std::cout
                  << "SubChunk candidates: "
                  << subchunks
                  << std::endl;

              std::cout
                  << std::endl
                  << "value[1] distribution:"
                  << std::endl;

              std::cout
                  << "  0 : "
                  << value0
                  << std::endl;

              std::cout
                  << "  1 : "
                  << value1
                  << std::endl;

              std::cout
                  << "  2 : "
                  << value2
                  << std::endl;

              std::cout
                  << "  3 : "
                  << value3
                  << std::endl;

              std::cout
                  << "  4 : "
                  << value4
                  << std::endl;

              std::cout
                  << "  5 : "
                  << value5
                  << std::endl;

              std::cout
                  << "  6 : "
                  << value6
                  << std::endl;

              std::cout
                  << "  7 : "
                  << value7
                  << std::endl;

              std::cout
                  << "  8 : "
                  << value8
                  << std::endl;

              std::cout
                  << "  9 : "
                  << value9
                  << std::endl;

              delete db;

              return 0;
          }
          CPP

          echo
          echo "=== Compiling inspection tool ==="

          g++ \
            -std=c++17 \
            -O2 \
            -I"$LEVELDB_INCLUDE" \
            /tmp/inspect_leveldb.cpp \
            "$LEVELDB_LIBRARY" \
            -pthread \
            -o /tmp/inspect_leveldb

          echo
          echo "Inspection tool built successfully."

      - name: Inspect actual LevelDB records
        run: |
          set -e

          DB_DIR="$GITHUB_WORKSPACE/world/extracted/db"

          echo "=========================================="
          echo " Inspecting actual LevelDB records"
          echo "=========================================="

          /tmp/inspect_leveldb "$DB_DIR"

      - name: Install bedrock-viz
        run: |
          set -e

          cd bedrock-viz/build

          echo "=========================================="
          echo " Installing bedrock-viz"
          echo "=========================================="

          sudo cmake --install .

      - name: Verify bedrock-viz installation
        run: |
          set -e

          echo "=========================================="
          echo " Installed executable"
          echo "=========================================="

          which bedrock-viz

          echo
          echo "=========================================="
          echo " Installed data files"
          echo "=========================================="

          find /usr/local/share/bedrock-viz \
            -maxdepth 3 \
            -type f \
            -print

          echo
          echo "=========================================="
          echo " Checking bedrock_viz.xml"
          echo "=========================================="

          XML_FILE="/usr/local/share/bedrock-viz/data/bedrock_viz.xml"

          if [ -f "$XML_FILE" ]; then
            echo "FOUND:"
            echo "$XML_FILE"
          else
            echo "ERROR: bedrock_viz.xml was not installed."
            exit 1
          fi

      - name: Generate map
        run: |
          set -e

          WORLD_DIR="$GITHUB_WORKSPACE/world/extracted"

          mkdir -p "$GITHUB_WORKSPACE/map"

          echo "=========================================="
          echo " World"
          echo "=========================================="

          echo "$WORLD_DIR"

          echo
          echo "=== level.dat ==="

          ls -lh "$WORLD_DIR/level.dat"

          echo
          echo "=== db ==="

          ls -ld "$WORLD_DIR/db"

          echo
          echo "=========================================="
          echo " bedrock-viz"
          echo "=========================================="

          BEDROCK_VIZ="$(which bedrock-viz)"

          echo "Using:"
          echo "$BEDROCK_VIZ"

          echo
          echo "=========================================="
          echo " Running bedrock-viz"
          echo "=========================================="

          "$BEDROCK_VIZ" \
            --db "$WORLD_DIR" \
            --out "$GITHUB_WORKSPACE/map/out1" \
            --html-most

      - name: Check generated map
        run: |
          set -e

          echo "=========================================="
          echo " Generated map"
          echo "=========================================="

          if [ -d "map" ]; then

            find map \
              -maxdepth 4 \
              -type f \
              | head -200

            echo
            echo "=== File count ==="

            find map \
              -type f \
              | wc -l

          else
            echo "ERROR: map directory was not created."
            exit 1
          fi

      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-viz-map
          path: map/
          retention-days: 7
