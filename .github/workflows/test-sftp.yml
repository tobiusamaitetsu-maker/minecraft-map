name: Generate Bedrock Map

on:
  workflow_dispatch:

jobs:
  generate-map:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. 必要なツールをインストール
      # ----------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            sshpass \
            cmake \
            libxml2-dev \
            libpng-dev \
            libboost-all-dev \
            g++ \
            git \
            patch

      # ----------------------------------------
      # 2. コンパイラを確認
      # ----------------------------------------
      - name: Check compiler
        run: |
          echo "=== GCC ==="
          gcc --version

          echo "=== G++ ==="
          g++ --version

          echo "=== CMake ==="
          cmake --version

      # ----------------------------------------
      # 3. C++17を強制
      # ----------------------------------------
      - name: Set C++17 environment
        run: |
          echo "CXX=g++" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo 'CXXFLAGS=-std=c++17' >> "$GITHUB_ENV"

      # ----------------------------------------
      # 4. RingoNetworksからワールドアーカイブを取得
      # ----------------------------------------
      - name: Download world archive
        env:
          SSHPASS: ${{ secrets.RINGO_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.RINGO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.RINGO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.RINGO_SFTP_USER }}
        run: |
          mkdir -p world

          printf '%s\n' \
            'get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world/archive.tar.gz' \
            'bye' \
          | sshpass -e sftp \
              -o StrictHostKeyChecking=no \
              -P "$SFTP_PORT" \
              "$SFTP_USER@$SFTP_HOST"

      # ----------------------------------------
      # 5. アーカイブを確認
      # ----------------------------------------
      - name: Check downloaded archive
        run: |
          echo "=== archive ==="
          ls -lh world/archive.tar.gz

          echo "=== archive type ==="
          file world/archive.tar.gz

      # ----------------------------------------
      # 6. ワールドを展開
      # ----------------------------------------
      - name: Extract world
        run: |
          mkdir -p extracted

          tar -xzf world/archive.tar.gz -C extracted

      # ----------------------------------------
      # 7. level.dat / dbを確認
      # ----------------------------------------
      - name: Validate world
        run: |
          echo "=== level.dat ==="
          find extracted -name level.dat -type f -print

          echo "=== db ==="
          find extracted -type d -name db -print

          LEVEL_DAT=$(find extracted -name level.dat -type f | head -1)

          if [ -z "$LEVEL_DAT" ]; then
            echo "ERROR: level.dat was not found."
            exit 1
          fi

          WORLD_DIR=$(dirname "$LEVEL_DAT")

          echo "World directory:"
          echo "$WORLD_DIR"

          if [ ! -d "$WORLD_DIR/db" ]; then
            echo "ERROR: db directory was not found."
            exit 1
          fi

      # ----------------------------------------
      # 8. bedrock-vizを取得
      # ----------------------------------------
      - name: Checkout bedrock-viz
        run: |
          git clone --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

      # ----------------------------------------
      # 9. LevelDBパッチ
      # ----------------------------------------
      - name: Fix LevelDB build
        run: |
          cd bedrock-viz

          patch -p0 < patches/leveldb-1.22.patch

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "third_party/leveldb/table/compressor/zlib_compressor.cc"
          )

          text = path.read_text()

          if "#include <cstdint>" not in text:
              text = text.replace(
                  "#include <zlib.h>",
                  "#include <zlib.h>\n#include <cstdint>"
              )

              path.write_text(text)

              print("Added <cstdint> to zlib_compressor.cc")
          else:
              print("<cstdint> is already present")
          PY

      # ----------------------------------------
      # 10. filesystemヘッダーを確認
      # ----------------------------------------
      - name: Check filesystem headers
        run: |
          cd bedrock-viz

          echo "=== logger.h ==="
          sed -n '1,40p' include/logger.h

          echo "=== asset.h ==="
          cat include/asset.h

      # ----------------------------------------
      # 11. 必要なfilesystem includeを補正
      # ----------------------------------------
      - name: Fix filesystem includes
        run: |
          cd bedrock-viz

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("include/logger.h"),
              Path("include/asset.h"),
          ]

          for path in files:
              text = path.read_text()

              if "#include <filesystem>" not in text:
                  lines = text.splitlines()

                  insert_index = 0

                  while (
                      insert_index < len(lines)
                      and lines[insert_index].startswith("#")
                  ):
                      if lines[insert_index].startswith("#pragma once"):
                          insert_index += 1
                          continue

                      break

                  lines.insert(insert_index, "#include <filesystem>")

                  path.write_text("\n".join(lines) + "\n")

                  print(f"Added <filesystem> to {path}")
              else:
                  print(f"<filesystem> already exists in {path}")
          PY

          echo "=== logger.h after fix ==="
          sed -n '1,15p' include/logger.h

          echo "=== asset.h after fix ==="
          sed -n '1,15p' include/asset.h

      # ----------------------------------------
      # 12. CMakeLists.txtにC++17を明示
      # ----------------------------------------
      - name: Force C++17 in CMakeLists
        run: |
          cd bedrock-viz

          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()

          if "set(CMAKE_CXX_STANDARD 17)" not in text:
              marker = "project(bedrock-viz VERSION 0.1.2)"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: CMake project declaration was not found."
                  )

              text = text.replace(
                  marker,
                  marker
                  + "\n\n"
                  + "set(CMAKE_CXX_STANDARD 17)\n"
                  + "set(CMAKE_CXX_STANDARD_REQUIRED ON)\n"
                  + "set(CMAKE_CXX_EXTENSIONS OFF)"
              )

          if "CXX_STANDARD 17" not in text:
              marker = "add_library(${LIB_NAME} STATIC ${SRC_FILES})"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: libbedrock-viz target was not found."
                  )

              replacement = """add_library(${LIB_NAME} STATIC ${SRC_FILES})

          set_target_properties(${LIB_NAME} PROPERTIES
            CXX_STANDARD 17
            CXX_STANDARD_REQUIRED ON
            CXX_EXTENSIONS OFF
          )

          target_compile_features(${LIB_NAME} PUBLIC cxx_std_17)
          """

              text = text.replace(marker, replacement)

          if "target_compile_features(${BIN_NAME} PRIVATE cxx_std_17)" not in text:
              marker = "add_executable(${BIN_NAME} src/main.cc)"

              if marker in text:
                  replacement = """add_executable(${BIN_NAME} src/main.cc)

          set_target_properties(${BIN_NAME} PROPERTIES
            CXX_STANDARD 17
            CXX_STANDARD_REQUIRED ON
            CXX_EXTENSIONS OFF
          )

          target_compile_features(${BIN_NAME} PRIVATE cxx_std_17)
          """

                  text = text.replace(marker, replacement)

          path.write_text(text)

          print("C++17 configuration applied.")
          PY

          echo "=== CMakeLists C++ configuration ==="
          grep -n -A8 -B3 \
            "CXX_STANDARD\|target_compile_features" \
            CMakeLists.txt

      # ----------------------------------------
      # 13. CMakeを完全に再構築
      # ----------------------------------------
      - name: Configure CMake
        run: |
          cd bedrock-viz

          rm -rf build

          mkdir build
          cd build

          cmake .. \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_CXX_FLAGS="-std=c++17" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # ----------------------------------------
      # 14. 実際のコンパイルフラグを確認
      # ----------------------------------------
      - name: Verify C++17 compile flags
        run: |
          cd bedrock-viz/build

          echo "=== CMake compiler ==="
          grep -E \
            "CMAKE_C_COMPILER:|CMAKE_CXX_COMPILER:" \
            CMakeCache.txt || true

          echo "=== CMake C++ standard ==="
          grep -E \
            "CMAKE_CXX_STANDARD:|CMAKE_CXX_FLAGS:" \
            CMakeCache.txt || true

          echo "=== compile_commands.json ==="

          if [ ! -f compile_commands.json ]; then
            echo "ERROR: compile_commands.json was not generated."
            exit 1
          fi

          grep -o -- "-std=[^\" ]*" compile_commands.json \
            | sort \
            | uniq -c

          echo "=== checking for C++17 ==="

          if grep -q -- "-std=c++17" compile_commands.json; then
            echo "C++17 is enabled."
          elif grep -q -- "-std=gnu++17" compile_commands.json; then
            echo "GNU C++17 is enabled."
          else
            echo "ERROR: C++17 was NOT detected."
            exit 1
          fi

      # ----------------------------------------
      # 15. bedrock-vizをビルド
      # ----------------------------------------
      - name: Build bedrock-viz
        run: |
          cd bedrock-viz/build

          cmake --build . --parallel

          echo "=== built files ==="
          find . -maxdepth 3 -type f \
            -name "bedrock-viz" \
            -print

      # ----------------------------------------
      # 16. bedrock-vizでWeb地図を生成
      # ----------------------------------------
      - name: Generate map
        run: |
          LEVEL_DAT=$(find extracted -name level.dat -type f | head -1)
          WORLD_DIR=$(dirname "$LEVEL_DAT")

          mkdir -p map

          echo "=== World directory ==="
          echo "$WORLD_DIR"

          echo "=== Running bedrock-viz ==="

          ./bedrock-viz/build/bedrock-viz \
            --db "$WORLD_DIR" \
            --out map/out1 \
            --html-most

      # ----------------------------------------
      # 17. 生成結果を確認
      # ----------------------------------------
      - name: Check generated map
        run: |
          echo "=== generated map ==="
          find map -maxdepth 2 -type f | head -100

          echo "=== HTML files ==="
          find map -type f -name "*.html" -print

      # ----------------------------------------
      # 18. Artifactとして保存
      # ----------------------------------------
      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-viz-map
          path: map/
          if-no-files-found: error
          retention-days: 7
