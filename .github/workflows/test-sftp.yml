name: Build bedrock-viz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            tar \
            openssh-client \
            sshpass \
            libboost-all-dev \
            libpng-dev \
            zlib1g-dev

      - name: Download world
        env:
          RINGO_SFTP_HOST: ${{ secrets.RINGO_SFTP_HOST }}
          RINGO_SFTP_PORT: ${{ secrets.RINGO_SFTP_PORT }}
          RINGO_SFTP_USER: ${{ secrets.RINGO_SFTP_USER }}
          RINGO_SFTP_PASSWORD: ${{ secrets.RINGO_SFTP_PASSWORD }}
        run: |
          mkdir -p world_archive
          cd world_archive

          sshpass -p "$RINGO_SFTP_PASSWORD" \
            sftp \
              -o StrictHostKeyChecking=no \
              -o BatchMode=no \
              -P "$RINGO_SFTP_PORT" \
              "$RINGO_SFTP_USER@$RINGO_SFTP_HOST" <<EOF
          get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world.tar.gz
          bye
          EOF

          ls -lh world.tar.gz

      - name: Extract world
        run: |
          mkdir -p world

          tar -xzf world_archive/world.tar.gz -C world

          echo "===== level.dat ====="
          find world -name level.dat -print

          echo "===== db directory ====="
          find world -type d -name db -print

      - name: Clone bedrock-viz
        run: |
          git clone --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

          cd bedrock-viz

          git rev-parse HEAD

      - name: Apply patches
        working-directory: bedrock-viz
        run: |
          git apply -p0 patches/leveldb-1.22.patch
          git apply -p0 patches/pugixml-disable-install.patch

      - name: Fix LevelDB zlib include
        working-directory: bedrock-viz
        run: |
          FILE="third_party/leveldb/table/compressor/zlib_compressor.cc"

          if ! grep -q '#include <cstdint>' "$FILE"; then
            sed -i '1i#include <cstdint>' "$FILE"
          fi

      - name: Add C++17 settings to libbedrock-viz only
        working-directory: bedrock-viz
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()

          marker = 'add_library(${LIB_NAME} STATIC ${SRC_FILES})'

          addition = '''add_library(${LIB_NAME} STATIC ${SRC_FILES})

          set_property(TARGET ${LIB_NAME} PROPERTY CXX_STANDARD 17)
          set_property(TARGET ${LIB_NAME} PROPERTY CXX_STANDARD_REQUIRED ON)
          set_property(TARGET ${LIB_NAME} PROPERTY CXX_EXTENSIONS OFF)
          target_compile_features(${LIB_NAME} PRIVATE cxx_std_17)'''

          if marker not in text:
              raise SystemExit(
                  "CMakeLists.txt: 対象の add_library() が見つかりません"
              )

          if "target_compile_features(${LIB_NAME} PRIVATE cxx_std_17)" in text:
              print("C++17設定は既に追加されています")
          else:
              text = text.replace(marker, addition, 1)
              path.write_text(text)
              print("C++17設定を1か所だけ追加しました")

          PY

          echo "===== CMake変更箇所 ====="

          grep -A8 -B2 \
            'add_library(${LIB_NAME}' \
            CMakeLists.txt

      - name: Remove forced C++11 flag
        working-directory: bedrock-viz
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()

          old = 'set(CMAKE_CXX_STANDARD 17)'

          new = '''set(CMAKE_CXX_STANDARD 17)

          # Remove any externally injected C++11 standard flag.
          string(REGEX REPLACE "(^| )-std=c\\+\\+11( |$)" " " CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS}")
          string(REGEX REPLACE "(^| )-std=gnu\\+\\+11( |$)" " " CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS}")'''

          if old not in text:
              raise SystemExit(
                  "CMakeLists.txt: CMAKE_CXX_STANDARD 17 が見つかりません"
              )

          if "Remove any externally injected C++11 standard flag." in text:
              print("C++11除去設定は既に追加されています")
          else:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("C++11除去設定を追加しました")

          PY

          echo "===== CMAKE_CXX_FLAGS ====="
          grep -n "CMAKE_CXX_FLAGS" CMakeLists.txt || true

      - name: Configure CMake
        working-directory: bedrock-viz
        run: |
          rm -rf build

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Inspect asset compile command
        working-directory: bedrock-viz
        run: |
          python3 - <<'PY'
          import json

          with open("build/compile_commands.json") as f:
              commands = json.load(f)

          found = False

          for item in commands:
              if item["file"].endswith("/src/asset.cc"):
                  found = True

                  print("===== asset.cc compile command =====")
                  print(item["command"])
                  print()

                  command = item["command"]

                  if "-std=c++11" in command:
                      raise SystemExit(
                          "asset.cc に -std=c++11 が残っています"
                      )

                  if "-std=gnu++11" in command:
                      raise SystemExit(
                          "asset.cc に -std=gnu++11 が残っています"
                      )

                  if "-std=c++17" not in command:
                      raise SystemExit(
                          "asset.cc がC++17でコンパイルされていません"
                      )

          if not found:
              raise SystemExit(
                  "asset.cc のコンパイルコマンドが見つかりません"
              )
          PY

      - name: Build
        working-directory: bedrock-viz
        run: |
          cmake --build build --parallel 2

      - name: Install
        working-directory: bedrock-viz
        run: |
          sudo cmake --install build

      - name: Verify installation
        run: |
          which bedrock-viz

          test -f \
            /usr/local/share/bedrock-viz/data/bedrock_viz.xml

          echo "bedrock-viz installation: OK"

      - name: Test bedrock-viz
        run: |
          bedrock-viz --help
