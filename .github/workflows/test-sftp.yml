name: Test RingoNetworks SFTP

on:
  workflow_dispatch:

jobs:
  test-sftp:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Check SFTP
        env:
          SSHPASS: ${{ secrets.RINGO_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.RINGO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.RINGO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.RINGO_SFTP_USER }}
        run: |
          printf '%s\n' \
            'pwd' \
            'ls -la' \
            'ls -la /world' \
            'ls -la /world/level' \
            'bye' \
          | sshpass -e sftp \
              -o StrictHostKeyChecking=no \
              -P "$SFTP_PORT" \
              "$SFTP_USER@$SFTP_HOST"
