name: Generate Bedrock Map

on:
  workflow_dispatch:

jobs:
  generate-map:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. 必要なツールをインストール
      # ----------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            sshpass \
            cmake \
            libxml2-dev \
            libpng-dev \
            libboost-all-dev \
            g++ \
            git \
            patch

      # ----------------------------------------
      # 2. RingoNetworksからワールドアーカイブを取得
      # ----------------------------------------
      - name: Download world archive
        env:
          SSHPASS: ${{ secrets.RINGO_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.RINGO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.RINGO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.RINGO_SFTP_USER }}
        run: |
          mkdir -p world

          printf '%s\n' \
            'get /worlds/level/archive-2026-09-10T185240+0900.tar.gz world/archive.tar.gz' \
            'bye' \
          | sshpass -e sftp \
              -o StrictHostKeyChecking=no \
              -P "$SFTP_PORT" \
              "$SFTP_USER@$SFTP_HOST"

      # ----------------------------------------
      # 3. アーカイブを確認
      # ----------------------------------------
      - name: Check downloaded archive
        run: |
          echo "=== archive ==="
          ls -lh world/archive.tar.gz

          echo "=== archive type ==="
          file world/archive.tar.gz

      # ----------------------------------------
      # 4. ワールドを展開
      # ----------------------------------------
      - name: Extract world
        run: |
          mkdir -p extracted

          tar -xzf world/archive.tar.gz -C extracted

      # ----------------------------------------
      # 5. level.dat / dbを確認
      # ----------------------------------------
      - name: Validate world
        run: |
          echo "=== level.dat ==="
          find extracted -name level.dat -type f -print

          echo "=== db ==="
          find extracted -type d -name db -print

          LEVEL_DAT=$(find extracted -name level.dat -type f | head -1)

          if [ -z "$LEVEL_DAT" ]; then
            echo "ERROR: level.dat was not found."
            exit 1
          fi

          WORLD_DIR=$(dirname "$LEVEL_DAT")

          echo "World directory:"
          echo "$WORLD_DIR"

          if [ ! -d "$WORLD_DIR/db" ]; then
            echo "ERROR: db directory was not found."
            exit 1
          fi

      # ----------------------------------------
      # 6. bedrock-vizを取得
      # ----------------------------------------
      - name: Checkout bedrock-viz
        run: |
          git clone --recursive \
            https://github.com/paulgrahek/bedrock-viz.git \
            bedrock-viz

      # ----------------------------------------
      # 7. bedrock-vizのLevelDBを修正
      # ----------------------------------------
      - name: Fix LevelDB build
        run: |
          cd bedrock-viz

          patch -p0 < patches/leveldb-1.22.patch

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "third_party/leveldb/table/compressor/zlib_compressor.cc"
          )

          text = path.read_text()

          if "#include <cstdint>" not in text:
              text = text.replace(
                  "#include <zlib.h>",
                  "#include <zlib.h>\n#include <cstdint>"
              )

              path.write_text(text)

              print("Added <cstdint> to zlib_compressor.cc")
          else:
              print("<cstdint> is already present")
          PY

      # ----------------------------------------
      # 8. CMakeLists.txtにC++17を明示的に強制
      # ----------------------------------------
      - name: Force C++17
        run: |
          cd bedrock-viz

          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()

          marker = "add_library(${LIB_NAME} STATIC ${SRC_FILES})"

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find libbedrock-viz target definition."
              )

          replacement = """add_library(${LIB_NAME} STATIC ${SRC_FILES})

          set_target_properties(${LIB_NAME} PROPERTIES
            CXX_STANDARD 17
            CXX_STANDARD_REQUIRED ON
            CXX_EXTENSIONS OFF
          )

          target_compile_features(${LIB_NAME} PUBLIC cxx_std_17)
          """

          if "target_compile_features(${LIB_NAME} PUBLIC cxx_std_17)" not in text:
              text = text.replace(marker, replacement)

          exe_marker = "add_executable(${BIN_NAME} src/main.cc)"

          if exe_marker not in text:
              raise SystemExit(
                  "ERROR: Could not find bedrock-viz executable target."
              )

          exe_replacement = """add_executable(${BIN_NAME} src/main.cc)

          set_target_properties(${BIN_NAME} PROPERTIES
            CXX_STANDARD 17
            CXX_STANDARD_REQUIRED ON
            CXX_EXTENSIONS OFF
          )

          target_compile_features(${BIN_NAME} PRIVATE cxx_std_17)
          """

          if "target_compile_features(${BIN_NAME} PRIVATE cxx_std_17)" not in text:
              text = text.replace(exe_marker, exe_replacement)

          path.write_text(text)

          print("C++17 has been explicitly forced for bedrock-viz targets.")
          PY

          echo "=== CMakeLists.txt C++ settings ==="
          grep -n -A8 -B2 \
            "target_compile_features" \
            CMakeLists.txt

      # ----------------------------------------
      # 9. CMakeを設定
      # ----------------------------------------
      - name: Configure CMake
        run: |
          cd bedrock-viz

          rm -rf build
          mkdir build
          cd build

          cmake .. \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # ----------------------------------------
      # 10. C++標準が正しく設定されたか確認
      # ----------------------------------------
      - name: Check C++ standard
        run: |
          cd bedrock-viz/build

          echo "=== CMake CXX standard ==="
          grep -E \
            "CMAKE_CXX_STANDARD:|CMAKE_CXX_COMPILER:" \
            CMakeCache.txt || true

          echo "=== compile commands ==="

          if [ -f compile_commands.json ]; then
            grep -o -- "-std=[^\" ]*" compile_commands.json \
              | sort \
              | uniq -c \
              | head -20
          else
            echo "compile_commands.json was not generated."
          fi

      # ----------------------------------------
      # 11. bedrock-vizをビルド
      # ----------------------------------------
      - name: Build bedrock-viz
        run: |
          cd bedrock-viz/build

          cmake --build . --parallel

          echo "=== built files ==="
          find . -maxdepth 3 -type f -name "bedrock-viz" -print

      # ----------------------------------------
      # 12. bedrock-vizでWeb地図を生成
      # ----------------------------------------
      - name: Generate map
        run: |
          LEVEL_DAT=$(find extracted -name level.dat -type f | head -1)
          WORLD_DIR=$(dirname "$LEVEL_DAT")

          mkdir -p map

          echo "=== World directory ==="
          echo "$WORLD_DIR"

          echo "=== Running bedrock-viz ==="

          ./bedrock-viz/build/bedrock-viz \
            --db "$WORLD_DIR" \
            --out map/out1 \
            --html-most

      # ----------------------------------------
      # 13. 生成結果を確認
      # ----------------------------------------
      - name: Check generated map
        run: |
          echo "=== generated map ==="
          find map -maxdepth 2 -type f | head -100

          echo "=== HTML files ==="
          find map -type f -name "*.html" -print

      # ----------------------------------------
      # 14. Artifactとして保存
      # ----------------------------------------
      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-viz-map
          path: map/
          if-no-files-found: error
          retention-days: 7
